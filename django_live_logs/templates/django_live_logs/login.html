<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Logs Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-300 h-screen flex items-center justify-center font-sans">
    <div class="bg-gray-800 p-8 rounded-lg shadow-xl w-full max-w-sm border border-gray-700">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-white mb-2">Live Logs</h1>
            <p class="text-sm text-gray-400">Team Access Required</p>
        </div>
        
        {% if error %}
        <div class="bg-red-500/10 border border-red-500/50 text-red-400 px-3 py-2 rounded text-sm mb-4 text-center">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <input type="password" name="password" required placeholder="Enter Team Password" 
                    class="w-full bg-gray-900 border border-gray-600 rounded px-4 py-2 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
            </div>
            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 px-4 rounded transition-colors shadow">
                Authenticate
            </button>
        </form>
    </div>
</body>
</html>
